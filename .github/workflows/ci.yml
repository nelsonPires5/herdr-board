name: CI

on:
  push:
    # main is production; dev is the long-lived integration branch. The Release
    # workflow stays bound to main, so a dev push runs CI but never publishes.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rs-clippy-check posts warnings as annotations via the Checks API.
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # On pull requests, surface clippy warnings as annotations on the diff.
      # The action runs cargo clippy with the given args; `-- -D warnings`
      # makes clippy exit non-zero on any warning, which fails the check.
      - name: clippy (PR annotations)
        if: github.event_name == 'pull_request'
        uses: clechasseur/rs-clippy-check@v6.0.5
        with:
          args: --workspace --all-targets --all-features -- -D warnings

      # On push to main there is no PR context for annotations, so gate with a
      # plain clippy run that still fails the job on any warning.
      - name: clippy (push gate)
        if: github.event_name != 'pull_request'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The three jobs below are split by what they protect, not by language, and
  # none of them needs a Rust toolchain — so a stale doc, a broken release
  # script, or a regressed safety token reports in seconds instead of queueing
  # behind a compile. They also fail independently: when they shared one job
  # with `cargo test`, the first failure hid the other two answers.
  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pins the version matrix, the e2e scenario catalog, the documented
      # install refs, and this workflow's own gate list against docs/README.md.
      - name: Documentation contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs.py'

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Release/install helpers are stdlib-only and part of the release gate.
      - name: Release helper
        run: python3 -m unittest discover -s scripts/tests -p 'test_prepare_release.py'

      - name: CLI installer
        run: python3 -m unittest discover -s scripts/tests -p 'test_install_cli.py'

      - name: Claude config staging
        run: python3 -m unittest discover -s scripts/tests -p 'test_stage_claude_config.py'

  e2e-safety:
    name: e2e-safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Both halves of the provider-free STATIC safety gate for the e2e harness:
      # ownership tokens, key scrubbing, cleanup ledger handling. They are two
      # implementations of the same checks (Python with real sockets and tamper
      # matrices, shell over the scenario sources), so they belong together and
      # this is where one of them should eventually be retired. Neither starts a
      # Herdr nor calls a provider, unlike the live suite (e2e/run-all.sh).
      - name: E2E safety (python)
        run: python3 -m unittest discover -s scripts/tests -p 'test_e2e_*.py'

      - name: E2E safety (shell)
        run: bash e2e/test-harness.sh

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Unit / integration tests are hermetic: live-herdr tests are #[ignore]d,
      # so this job needs no Herdr binary. The dependent live-e2e job owns that.
      - name: Rust tests
        run: cargo test --workspace --all-features

  live-e2e:
    name: live-e2e
    needs: [fmt, clippy, docs, scripts, e2e-safety, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Herdr 0.8.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/herdr-board-0.8.2-linux-x86_64
          key: herdr-${{ runner.os }}-x86_64-0.8.2-976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4

      - name: Provider-free live E2E
        env:
          HERDR_CACHE_DIR: ${{ runner.tool_cache }}/herdr-board-0.8.2-linux-x86_64
        run: bash e2e/ci.sh

      - name: Upload live E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 30
